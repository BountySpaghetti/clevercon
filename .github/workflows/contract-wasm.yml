name: Contract wasm

# Builds the deployable release wasm for the contracts and uploads them, so they
# can be deployed with `stellar contract deploy` locally (the wasm BUILD is a
# cargo compile that OOMs a small WSL; deploying the prebuilt wasm is lightweight).
# Optimize locally if you want smaller wasm: `stellar contract optimize --wasm X`.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wasm:
    name: Build contract wasm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2

      - name: Build each contract to wasm
        run: |
          mkdir -p wasm
          for c in policy-verifier agent-vault registry; do
            if [ -f "contracts/$c/Cargo.toml" ]; then
              echo "== building $c =="
              cargo build --release --target wasm32-unknown-unknown \
                --manifest-path "contracts/$c/Cargo.toml"
            fi
          done
          find contracts -path '*/wasm32-unknown-unknown/release/*.wasm' \
            -not -path '*/deps/*' -exec cp {} wasm/ \;
          ls -la wasm

      - name: Upload contract wasm
        uses: actions/upload-artifact@v4
        with:
          name: contract-wasm
          path: wasm/
          retention-days: 90
